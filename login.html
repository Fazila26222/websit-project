<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--css and bootstrap file-->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/variable.css">

    <!--icons and fonts file-->
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.css">

    <title>Login Form</title>
</head>

<body>
    <section>
        <div class="container">
            <div class="card p-4">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center right-section">
                        <img src="img/logo.jpg" class="img-fluid" alt="">
                        <h1>به صرافی دریابی خوش آمدید</h1>
                        <p>تجربه یک معامله سریع, امن و مطمئن با بهترین نرخ ارز در افغانستان</p>
                        <img src="img/phone-currency.png" class="img-fluid" alt="">

                        <div class="row">
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-headset"></i></div>
                                <div class="lbl">پشتبانی</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-bar-chart"></i></div>
                                <div class="lbl"> نرخ های رقابتی</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-shield-check"></i></div>
                                <div class="lbl">امنیت بالا</div>
                            </div>
                        </div>
                    </div>
<!--=================================
                     Left Section
====================================-->
                       <div class="col-md-8">
                        <div class="heading">
                            <h2>ورود به حساب کاربری</h2>
                            <p>لطفا برای ادامه وارد حساب خود شوید</p>
                            <form class="form">
                                <div class="row">
                                    <div class="col-md-6">
                                        <input type="text" placeholder="ورود با ایمیل یا موبایل">
                                    </div>

                                    <div class="col-md-6">
                                        <input type="text" placeholder="ورود با کد یکبارمصرف(OTP)">
                                    </div>
                                </div>

                                <h6>ایمیل یا شماره موبایل</h6>
                                <input type="text" placeholder="ایمیل یا شماره خود راوارد کنید">
                                <h6>رمزعبور</h6>
                                <input type="text" placeholder="رمزعبور خود را وارد کنید">

                                <div class="row">
                                    <div class="col-md-6">
                                        <a href="#">رمزخود رافراموش کرده اید؟</a>
                                    </div>

                                    <div class="col-md-6">
                                        <input type="checkbox">مرا به خاطربسپار
                                    </div>
                                </div>
                                <button type="submit">ورود به حساب</button>
                                <div class="d-flex align-items-center">
                                    <hr class="flex-grow-1"><span> یا </span> </span>
                                    <hr class="flex-grow-1">
                                </div>
                                <input type="text" placeholder="ورود با کد یکبارمصرف(OTP)">

                                <div class="row">
                                    <div class="col-md-6">
                                        <a href="register.html">ثبت نام کنید</a>
                                    </div>

                                    <div class="col-md-6">
                                        <a href="#">حساب کاربری ندارید؟</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
<!--js file-->
<script src="js/bootstrap.bundle.min.js"></script>

</html>
