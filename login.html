<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--css and bootstrap file-->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/variable.css">

    <!--icons and fonts file-->
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.css">

    <title>Login Form</title>
</head>

<body>
    <section>
        <div class="container">
            <div class="card p-4">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center right-section">
                        <img src="img/logo.jpg" class="img-fluid" alt="">
                        <h1>به صرافی دریابی خوش آمدید</h1>
                        <p>تجربه یک معامله سریع, امن و مطمئن با بهترین نرخ ارز در افغانستان</p>
                        <img src="img/phone-currency.png" class="img-fluid" alt="">

                        <div class="row">
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-headset"></i></div>
                                <div class="lbl">پشتبانی</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-bar-chart"></i></div>
                                <div class="lbl"> نرخ های رقابتی</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-shield-check"></i></div>
                                <div class="lbl">امنیت بالا</div>
                            </div>
                        </div>
                    </div>
                    <!--=================================
                     Left Section
====================================-->
                    <div class="col-md-8">
                        <div class="heading">
                            <h2>ورود به حساب کاربری</h2>
                            <p>لطفا برای ادامه وارد حساب خود شوید</p>
                            <form class="form">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="position-relative">
                                            <i class="bi bi-person position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                            <input type="text" class="form-control pe-5 text-end"
                                                placeholder="ورود با ایمیل یا موبایل">
                                        </div>

                                    </div>

                                    <div class="col-md-6">
                                        <div class="position-relative">
                                            <i class="bi bi-shield-check position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                            <input type="password" class="form-control pe-5 text-end"
                                                placeholder="ورود با کد یکبارمصرف(OTP)">
                                        </div>
                                    </div>

                                    <h6>ایمیل یا شماره موبایل</h6>
                                    <div class="position-relative">
                                        <i class="bi bi-envelope position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="email" class="form-control pe-5 text-end"
                                            placeholder="ایمیل یا شماره خود راوارد کنید">
                                    </div>
                                    <h6>رمزعبور</h6>
                                    <div class="position-relative">
                                        <i class="bi bi-lock position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <i class="bi bi-eye position-absolute top-50 start-0 translate-middle-y ms-3
                                            "></i>
                                        <input type="password" class="form-control pe-5 text-end"
                                            placeholder="رمزعبور خود را وارد کنید">
                                    </div>
                                    <div class="row">

                                        <div class="col-md-6">
                                            <a href="#">رمزخود رافراموش کرده اید؟</a>
                                        </div>

                                        <div class="col-md-6">
                                            <div class="d-flex align-items-center">
                                                <input type="checkbox">
                                                <label> مرا به خاطربسپار
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="position-relative">
                                        <button type="submit"><a href="index.html">ورود به حساب</a></button>
                                    </div>

                                    <div class="d-flex align-items-center">
                                        <hr class="flex-grow-1"><span> یا </span>
                                        <hr class="flex-grow-1">
                                    </div>

                                    <div class="position-relative">
                                        <i class="bi bi-shield-check position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="password" class="form-control pe-5 text-end"
                                            placeholder="ورود با کد یکبارمصرف(OTP)">
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6">
                                            <a href="register.html">ثبت نام کنید</a>
                                        </div>

                                        <div class="col-md-6">
                                            <a href="register.html">حساب کاربری ندارید؟</a>
                                        </div>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
<!--js file-->
<script src="js/bootstrap.bundle.min.js"></script>

</html>
