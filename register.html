<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!--css and bootstrap file-->
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/variable.css">

    <!--icons and fonts file-->
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.min.css">
    <link rel="stylesheet" href="css/flag-icons.css">
</head>

<body>
    <!--============
    Right Section
    =============-->
    <section class="register">
        <div class="container">
            <div class="card p-4">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center right-section">
                        <img src="img/logo.jpg" class="img-fluid" alt="">
                        <h1>به صرافی<span style="color: #C98A36;"> دریابی </span>خوش آمدید</h1>
                        <p>بازارحرفه ای خرید وفروش ارزهای دیجتال امن,سریع و با کارمزد پایین</p>
                        <img src="img/phone-currency.png" class="img-fluid" alt="">

                        <div class="row">
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-percent"></i></div>
                                <div class="lbl">کارمزدپایین</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-clock-history"></i></div>
                                <div class="lbl">معاملات سریع</div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="icon"><i class="bi bi-shield-check"></i></div>
                                <div class="lbl">امنیت بالا</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <a href="login.html">حساب دارید؟</a>
                            </div>
                            <div class="col-md-6 ">
                                <a href="login.html">واردشوید</a>
                            </div>
                        </div>
                    </div>
                    <!--============
    Right Section
    =============-->

                    <div class="col-md-8 text-center">
                        <div class="heading">
                            <h1>ایجادحساب کاربری</h1>
                            <p>لطفا اطلاعات خود را وارد نمایید</p>
                        </div>
                        <form class="form">
                            <div class="row">
                                <div class="col-md-6 ">
                                    <label>نام</label><br>
                                    <div class="position-relative">
                                        <i class="bi bi-person position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="text" class="form-control pe-5 text-end"
                                            placeholder="نام خود را وارید کنید ">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label>نام خانوادگی</label><br>
                                    <div class="position-relative">
                                        <i class="bi bi-person position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="text" class="form-control pe-5 text-end"
                                            placeholder="نام خانوادگی خود را وارد کنید">
                                    </div>
                                </div>
                            </div>

                            <label>ایمیل</label><br>
                            <div class="position-relative">
                                <i class="bi bi-envelope position-absolute top-50 end-0 translate-middle-y me-3"></i>
                                <input type="email" class="form-control pe-5 text-end"
                                    placeholder="ایمیل خود را وارد کنید">
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <label>کد کشور</label><br>
                                    <select class="form-select form-select-lg">
                                        <option value="">+98</option>
                                        <option value="">+92</option>
                                        <option value="">+93</option>
                                        <option value="">+64</option>
                                        <option value="">+91</option>
                                    </select>
                                </div>

                                <div class="col-md-8">
                                    <label>شماره تماس</label><br>
                                    <div class="position-relative">
                                        <i class="bi bi-telephone position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="phone" class="form-control pe-5 text-end"
                                            placeholder="شماره خود را وارید نمایید">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <label>رمز عبور</label><br>
                                    <div class="position-relative">
                                        <i class="bi bi-lock position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="password" class="form-control pe-5 text-end"
                                            placeholder="رمزعبور خود را وارد کنید">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label>تگرار رمز عبور</label><br>
                                    <div class="position-relative">
                                        <i class="bi bi-lock position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="password" class="form-control pe-5 text-end"
                                            placeholder="رمزعبور خود را وارد کنید">
                                    </div>
                                </div>
                            </div>

                            <label>کشور</label><br>
                            <select class="form-select form-select-lg">
                                <option value="">نام کشور خود را انتخاب کنید</option>
                                <option value="">افغانستان</option>
                                <option value="">ایران</option>
                                <option value="">آسترلیا</option>
                                <option value="">پاکستان</option>
                            </select>

                            <div class="d-flex align-items-center">
                                <input type="checkbox">
                                <label> شرایط و قوانین را مطالعه کرده میپزیرم </label>
                            </div>

                            <button type="submit">ایجاد حساب کاری</button>

                            <div class="d-flex align-items-center">
                                <hr class="flex-grow-1"><span> یا ثبت با </span>
                                <hr class="flex-grow-1">
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="position-relative">
                                        <i class="bi bi-apple position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="text" placeholder="Apple" class="form-control pe-5 text-end">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="position-relative">
                                        <i class="bi bi-google position-absolute top-50 end-0 translate-middle-y me-3
                                            "></i>
                                        <input type="text" placeholder="Google" class="form-control pe-5 text-end">
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
<!--js file-->
<script src="js/bootstrap.bundle.min.js"></script>

</html>
